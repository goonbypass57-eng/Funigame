name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/sofia-bennett-mobile-game-ceor7m
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement lets the workflow turn Pages on itself where the Actions
      # token has admin rights. Where it does not, creating the Pages site
      # returns "Resource not accessible by integration" and Pages has to be
      # switched on once by hand: Settings -> Pages -> Source: GitHub Actions.
      # Every push deploys after that; this step then just reads the config.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
